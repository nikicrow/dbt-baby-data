version: 2

sources:
  - name: baby_app
    # Defaults to database baby_data, schema public — where load_to_database.py
    # writes, on the server and on a developer machine alike. CI overrides
    # neither: its Postgres container is named baby_data for exactly that reason.
    database: "{{ env_var('DBT_SOURCE_DATABASE', 'baby_data') }}"
    schema: "{{ env_var('DBT_SOURCE_SCHEMA', 'public') }}"
    tables:
      - name: baby_profiles
      - name: diaper_events
      - name: feeding_sessions
      - name: growth_measurements
      - name: health_events
      - name: sleep_sessions
