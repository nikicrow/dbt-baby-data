# CI-only dbt profile, used by .github/workflows/dbt-ci.yml via
# `--profiles-dir ../ci`. It lives here rather than in baby_data/ so it never
# shadows the developer profile in ~/.dbt/profiles.yml during local runs —
# dbt prefers a profiles.yml found in the working directory.
#
# Every value defaults to the throwaway postgres service container the workflow
# starts, so CI needs no repo secrets. The env_var overrides exist only so the
# same profile can be pointed at a scratch database locally, e.g. to reproduce a
# CI failure:
#   CI_DB_NAME=ci_smoke CI_DB_PASSWORD=... dbt build --target ci --profiles-dir ../ci
baby_data:
  target: ci
  outputs:
    ci:
      type: postgres
      host: "{{ env_var('CI_DB_HOST', 'localhost') }}"
      port: "{{ env_var('CI_DB_PORT', '5432') | int }}"
      dbname: "{{ env_var('CI_DB_NAME', 'baby_data') }}"
      user: "{{ env_var('CI_DB_USER', 'postgres') }}"
      password: "{{ env_var('CI_DB_PASSWORD', 'postgres') }}"
      # Models land here; marts get the `ci`-target prefix applied by
      # macros/generate_schema_name.sql, so they build into <schema>_marts.
      schema: "{{ env_var('DBT_TARGET_SCHEMA', 'ci') }}"
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
