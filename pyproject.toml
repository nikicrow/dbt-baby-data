[project]
name = "dbt-baby-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.11.6",
    "dbt-postgres>=1.10.0",
    "pydantic>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.0",
]

# The ML code lives in ml/ as its own package (baby-ml), outside the dbt
# project. It's opt-in: `uv sync` (and CI) leave it out, and
# `uv sync --group ml` adds it plus Jupyter.
[dependency-groups]
ml = [
    "baby-ml",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[tool.uv.workspace]
members = ["ml"]

[tool.uv.sources]
baby-ml = { workspace = true }
