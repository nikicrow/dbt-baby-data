[project]
name = "dbt-baby-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.11.6",
    "dbt-postgres>=1.10.0",
    "pydantic>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.0",
]

# The ML code lives in ml/ as its own package (baby-ml), outside the dbt
# project. It's opt-in: `uv sync` (and CI) leave it out, and
# `uv sync --group ml` adds it plus Jupyter.
[dependency-groups]
ml = [
    "baby-ml",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]
# NVIDIA's Kumo Tabular foundation model (baby_ml.kumo). Opt-in on top of ml
# because torch is large: `uv sync --group ml --group kumo`. The library isn't
# on PyPI yet (only a placeholder), so it's pinned to a commit on GitHub.
kumo = [
    "torch>=2.7",
    "structured-data-models @ git+https://github.com/NVIDIA/structured-data-models.git@5d663369ff8ead4a78c910dbb8483d558e46627b",
]

[tool.uv.workspace]
members = ["ml"]

[tool.uv.sources]
baby-ml = { workspace = true }
